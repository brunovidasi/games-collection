name: Deploy to Server via FTP

# This repo deploys itself to public_html/games (brunovida.si/games). The
# brunovidasi.com repo excludes games/ from its own deploy, so neither touches
# the other's files. The covers and the instance (config, database) aren't in
# the repo, and the deploy only ever deletes files it uploaded itself, so they
# stay as they are on the server.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The site's scripts and stylesheets go up minified (about a third smaller gzipped); the repo keeps them
      # as written. Only the checkout here is changed. Each file stays a file of its own, and esbuild keeps the
      # names a script declares at its top (dropdown.js's dropdown()), which the others call.
      - name: Minify the CSS and JS
        run: |
          for f in public/js/*.js public/css/*.css; do
            npx --yes esbuild@0.24.0 "$f" --minify --outfile="$f" --allow-overwrite --log-level=warning
          done

      # FTP_SERVER_DIR (a repository variable) is only needed for an FTP account
      # whose root is not the hosting account's: one locked to the games folder
      # uses ./
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || '/domains/brunovidasi.com/public_html/games/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
